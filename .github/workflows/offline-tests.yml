name: offline-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: 'python -m pip install --require-hashes --only-binary :all: -r requirements-dev.lock'
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -c "import pii_airlock"
      - run: pii-airlock --help
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q src tests scripts
      - run: python scripts/scan_secrets.py
