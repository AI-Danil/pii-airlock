name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-and-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: 'python -m pip install --require-hashes --only-binary :all: -r requirements-dev.lock'
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: 'python -m pip install --require-hashes --only-binary :all: -r requirements-security.lock'
      - run: python scripts/scan_secrets.py
      - run: pip-audit --disable-pip --no-deps -r requirements.lock
      - run: cyclonedx-py requirements requirements.lock --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pii-airlock-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
