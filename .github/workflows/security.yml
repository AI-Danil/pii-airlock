name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-and-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip install pip-audit==2.10.1 cyclonedx-bom==7.3.0
      - run: python scripts/scan_secrets.py
      - run: pip-audit --no-deps -r requirements.lock
      - run: cyclonedx-py requirements requirements.lock --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pii-airlock-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
