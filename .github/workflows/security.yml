name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-and-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: 'python -m pip install --require-hashes --only-binary :all: -r requirements-dev.lock'
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: 'python -m pip install --require-hashes --only-binary :all: -r requirements-security.lock'
      - run: python scripts/scan_secrets.py
      - run: pip-audit --disable-pip --no-deps -r requirements.lock
      - run: cyclonedx-py requirements requirements.lock --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pii-airlock-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
