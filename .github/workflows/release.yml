name: attested-release-build

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: 'python -m pip install --require-hashes --only-binary :all: -r requirements-security.lock'
      - run: python -m build --no-isolation
      - run: cyclonedx-py requirements requirements.lock --output-format JSON --output-file dist/pii-airlock-sbom.cdx.json
      - uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pii-airlock-attested-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
