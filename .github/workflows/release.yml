name: attested-release-build

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.3.0 cyclonedx-bom==7.3.0
      - run: python -m build
      - run: cyclonedx-py requirements requirements.lock --output-format JSON --output-file dist/pii-airlock-sbom.cdx.json
      - uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pii-airlock-attested-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
