[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-airlock"
version = "0.4.0"
description = "Local-first privacy gateway that pseudonymizes sensitive data before cloud LLM calls."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "AI-Danil"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.51.0,<1",
  "python-multipart>=0.0.18,<1",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "reportlab>=4,<5",
  "ruff>=0.12,<1",
  "hypothesis>=6,<7",
]

[project.scripts]
pii-airlock = "pii_airlock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pii_airlock = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
